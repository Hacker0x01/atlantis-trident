name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: actionlint
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      - name: shellcheck standalone scripts
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "no standalone .sh files"; exit 0; fi
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb "${files[@]}"
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
      - name: Unit tests
        run: node --test
  smoke:
    needs: [lint, unit]
    # A caller must grant every permission the called reusable workflow
    # declares at its top level, even ones this run won't exercise: a reusable
    # workflow cannot escalate beyond its caller, so omitting id-token here
    # makes terraform-plan.yml's `id-token: write` an escalation and the run
    # fails at startup. aws_auth=none means no token is actually minted.
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform-plan.yml
    with:
      stacks: "hello"
      working_directory: examples/fixture
      aws_auth: none
    # terraform-plan.yml references secrets.AWS_GITHUB_ACTIONS_ROLE_ARN; inherit
    # so the call satisfies the reference (unused when aws_auth=none).
    secrets: inherit
  lambda-smoke:
    needs: [lint, unit]
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform-lambda-plan.yml
    with:
      build_command: "bash examples/lambda-fixture/build.sh"
      artifact_path: "examples/lambda-fixture/dist/lambda.zip"
      working_directory: examples/lambda-fixture/terraform
      use_uv: false
      aws_auth: none
    secrets:
      tf_var_secrets: |
        some_secret=smoke-value
