name: terraform-apply
on:
  workflow_call:
    inputs:
      stacks:
        description: Space-separated, dependency-ordered stack names under <working_directory>/stacks/.
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.11.4"
      aws_region:
        required: false
        type: string
        default: "us-west-2"
      project:
        required: false
        type: string
        default: ""
      working_directory:
        required: false
        type: string
        default: "terraform"
      environment:
        description: Protected environment gating the apply (required reviewers).
        required: false
        type: string
        default: "production"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup
        id: setup
        # Full owner/repo path + release ref: a reusable workflow's `./` paths
        # resolve against the CALLER's checkout, not this repo. Composite refs
        # track the release tag. @main is temporary pre-v1 — flip to @v1 at release.
        uses: Hacker0x01/atlantis-trident/.github/actions/setup-terraform-aws@main
        with:
          terraform_version: ${{ inputs.terraform_version }}
          aws_region: ${{ inputs.aws_region }}
          project: ${{ inputs.project }}
          role_arn: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws_auth: oidc
      - name: Apply stacks in order
        shell: bash
        env:
          STATE_BUCKET: ${{ steps.setup.outputs.state_bucket }}
          STACKS: ${{ inputs.stacks }}
        run: |
          set -e
          # shellcheck disable=SC2086
          for stack in $STACKS; do
            echo "::group::apply $stack"
            terraform -chdir="stacks/$stack" init -input=false -backend-config="bucket=$STATE_BUCKET"
            terraform -chdir="stacks/$stack" apply -input=false -auto-approve
            echo "::endgroup::"
          done
