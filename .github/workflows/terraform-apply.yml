name: terraform-apply
on:
  workflow_call:
    inputs:
      stacks:
        description: >
          Space-separated stack names under <working_directory>/stacks/.
          Each is applied as its OWN parallel job (one flow per stack). Stacks
          run concurrently — do not rely on apply order; if a stack reads
          another's remote_state, ensure that stack has been applied at least
          once (bootstrap) so the read doesn't race.
        required: true
        type: string
      terraform_version:
        required: false
        type: string
        default: "1.11.4"
      aws_region:
        required: false
        type: string
        default: "us-west-2"
      project:
        required: false
        type: string
        default: ""
      working_directory:
        required: false
        type: string
        default: "terraform"
      environment:
        description: >
          Protected environment gating the apply (required reviewers). NOTE:
          with one job per stack, each stack is a separate deployment to this
          environment and requires its own approval.
        required: false
        type: string
        default: "production"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Turn the space-separated `stacks` string into a JSON array so the apply job
  # can fan out one matrix job per stack.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.matrix.outputs.stacks }}
    steps:
      - name: Build stack matrix
        id: matrix
        shell: bash
        env:
          STACKS: ${{ inputs.stacks }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          matrix="$(printf '%s\n' $STACKS | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "stacks=$matrix" >> "$GITHUB_OUTPUT"

  # One flow per stack. Stacks apply in parallel (fail-fast off so one stack's
  # failure doesn't cancel the others).
  apply:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.prepare.outputs.stacks) }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup
        id: setup
        # Full owner/repo path + release ref: a reusable workflow's `./` paths
        # resolve against the CALLER's checkout, not this repo.
        uses: Hacker0x01/atlantis-trident/.github/actions/setup-terraform-aws@v1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          aws_region: ${{ inputs.aws_region }}
          project: ${{ inputs.project }}
          role_arn: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws_auth: oidc
      - name: Apply ${{ matrix.stack }}
        shell: bash
        env:
          STATE_BUCKET: ${{ steps.setup.outputs.state_bucket }}
          STACK: ${{ matrix.stack }}
        run: |
          set -e
          terraform -chdir="stacks/$STACK" init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform -chdir="stacks/$STACK" apply -input=false -auto-approve
