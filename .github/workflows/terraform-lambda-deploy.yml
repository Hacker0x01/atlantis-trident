name: terraform-lambda-deploy
on:
  workflow_call:
    inputs:
      # Multi-app fan-out: a JSON array of objects, one per app/stack:
      #   [{ "build_command": "...", "artifact_path": "...", "working_directory": "..." }]
      # When set, each element becomes its own build+apply flow (parallel).
      # Leave empty to deploy a single app from the scalar inputs below.
      apps:
        required: false
        type: string
        default: ""
      # Single-app inputs (used only when `apps` is empty).
      build_command: { required: false, type: string, default: "" }
      artifact_path: { required: false, type: string, default: "" }
      working_directory: { required: false, type: string, default: "terraform" }
      python_version: { required: false, type: string, default: "3.13" }
      use_uv: { required: false, type: boolean, default: true }
      tf_vars: { required: false, type: string, default: "" }
      terraform_version: { required: false, type: string, default: "1.11.4" }
      aws_region: { required: false, type: string, default: "us-west-2" }
      project: { required: false, type: string, default: "" }
      environment:
        description: >
          Protected environment (required reviewers). NOTE: with one flow per
          app, each app is a separate deployment to this environment and needs
          its own approval.
        required: false
        type: string
        default: "production"
    secrets:
      tf_var_secrets: { required: false }
      AWS_GITHUB_ACTIONS_ROLE_ARN: { required: false }

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-lambda-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Build the app matrix: use `apps` if given, else synthesize a single-element
  # matrix from the scalar inputs. Fails if neither is provided.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - name: Build app matrix
        id: matrix
        shell: bash
        env:
          APPS: ${{ inputs.apps }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          if [ -n "${APPS:-}" ] && [ "$APPS" != "[]" ]; then
            matrix="$(echo "$APPS" | jq -c 'map(select(.build_command and .artifact_path))')"
          else
            if [ -z "$BUILD_COMMAND" ] || [ -z "$ARTIFACT_PATH" ]; then
              echo "::error::provide either the apps input (JSON array) or build_command + artifact_path"
              exit 1
            fi
            matrix="$(jq -cn \
              --arg b "$BUILD_COMMAND" \
              --arg a "$ARTIFACT_PATH" \
              --arg w "$WORKING_DIRECTORY" \
              '[{build_command:$b, artifact_path:$a, working_directory:$w}]')"
          fi
          echo "apps=$matrix" >> "$GITHUB_OUTPUT"

  # One flow per app: build its artifact, then Terraform apply it. Parallel.
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Resolve project
        id: proj
        shell: bash
        env:
          IN_PROJECT: ${{ inputs.project }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          project="$IN_PROJECT"
          [ -n "$project" ] || project="$REPO_NAME"
          echo "project=$project" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ inputs.python_version }}
      - name: Set up uv
        if: ${{ inputs.use_uv }}
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
      - name: uv sync
        if: ${{ inputs.use_uv }}
        shell: bash
        run: uv sync --frozen || uv sync
      - name: Build Lambda artifact
        shell: bash
        env:
          BUILD_COMMAND: ${{ matrix.app.build_command }}
          ARTIFACT_PATH: ${{ matrix.app.artifact_path }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$BUILD_COMMAND"
          if [ ! -f "$ARTIFACT_PATH" ]; then
            echo "::error::build_command did not produce artifact_path: $ARTIFACT_PATH"
            exit 1
          fi
      - name: Setup Terraform + AWS
        id: setup
        uses: Hacker0x01/atlantis-trident/.github/actions/setup-terraform-aws@v1
        with:
          terraform_version: ${{ inputs.terraform_version }}
          aws_region: ${{ inputs.aws_region }}
          project: ${{ steps.proj.outputs.project }}
          role_arn: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws_auth: oidc
      - name: Export TF vars
        shell: bash
        env:
          ARTIFACT_PATH: ${{ matrix.app.artifact_path }}
          TF_VARS: ${{ inputs.tf_vars }}
          TF_VAR_SECRETS: ${{ secrets.tf_var_secrets }}
        run: |
          set -euo pipefail
          abs="$(cd "$(dirname "$ARTIFACT_PATH")" && pwd)/$(basename "$ARTIFACT_PATH")"
          echo "TF_VAR_lambda_zip=$abs" >> "$GITHUB_ENV"
          emit() {
            local mask="$1" text="$2" line key val
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              key="${line%%=*}"; val="${line#*=}"
              [ -z "$key" ] && continue
              [ "$mask" = "mask" ] && echo "::add-mask::$val"
              printf 'TF_VAR_%s=%s\n' "$key" "$val" >> "$GITHUB_ENV"
            done <<< "$text"
          }
          if [ -n "${TF_VARS:-}" ]; then emit nomask "$TF_VARS"; fi
          if [ -n "${TF_VAR_SECRETS:-}" ]; then emit mask "$TF_VAR_SECRETS"; fi
      - name: Apply
        shell: bash
        working-directory: ${{ matrix.app.working_directory }}
        env:
          STATE_BUCKET: ${{ steps.setup.outputs.state_bucket }}
        run: |
          set -e
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET"
          terraform apply -input=false -auto-approve
